server:
  port: 18602
  servlet:
    context-path: /ai

spring:
  application:
    name: reachai-knowledge-service

  datasource:
    url: ${AI_MYSQL_URL:jdbc:mysql://${AI_MYSQL_HOST:localhost}:${AI_MYSQL_PORT:3306}/${AI_MYSQL_DATABASE:reach_ai}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${AI_MYSQL_USER:reach_ai}
    password: ${AI_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---- Milvus 閰嶇疆 ----
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  dimension: 1536

embedding:
  model-service:
    url: ${MODEL_SERVICE_URL:http://localhost:18601}

reachai:
  internal:
    service-secret: ${REACHAI_INTERNAL_SERVICE_SECRET:}
    # Production: DIRECT_TLS requires https URLs; MTLS_MESH explicitly attests sidecar/mesh protection.
    transport-mode: ${REACHAI_INTERNAL_TRANSPORT_MODE:DEVELOPMENT_PLAINTEXT}
    # Verification-only overlap keys for rolling rotation. Never used to sign new requests.
    accepted-service-secrets: ${REACHAI_INTERNAL_SERVICE_ACCEPTED_SECRETS:}
  personal-memory:
    # Dedicated HMAC key: Knowledge stores only a pseudonymous owner hash.
    index-identity-secret: ${REACHAI_PERSONAL_MEMORY_INDEX_IDENTITY_SECRET:}
    embedding:
      # Independent from Control's OFF/SHADOW/ACTIVE routing switch.
      # LEXICAL is the safe rollout default; HYBRID/VECTOR require a Model Center instance id.
      mode: ${REACHAI_PERSONAL_MEMORY_KNOWLEDGE_SEARCH_MODE:LEXICAL}
      model-instance-id: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_MODEL_INSTANCE_ID:}
      candidate-limit: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_CANDIDATE_LIMIT:1000}
      batch-size: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_BATCH_SIZE:32}
      fixed-delay-ms: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_FIXED_DELAY_MS:1000}
      initial-delay-ms: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_INITIAL_DELAY_MS:5000}
      observability-fixed-delay-ms: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_OBSERVABILITY_DELAY_MS:30000}
      observability-initial-delay-ms: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_OBSERVABILITY_INITIAL_DELAY_MS:10000}
      claim-seconds: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_CLAIM_SECONDS:120}
      max-attempts: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_MAX_ATTEMPTS:12}
      initial-backoff-seconds: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_INITIAL_BACKOFF_SECONDS:5}
      max-backoff-seconds: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_MAX_BACKOFF_SECONDS:3600}
      min-score: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_MIN_SCORE:0.5}
      vector-weight: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_VECTOR_WEIGHT:0.75}
      max-text-chars: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_MAX_TEXT_CHARS:4000}
      max-query-chars: ${REACHAI_PERSONAL_MEMORY_EMBEDDING_MAX_QUERY_CHARS:4000}
  knowledge:
    document-import:
      # This is also enforced in the parser before an untrusted file reaches Docling.
      max-file-bytes: ${REACHAI_KNOWLEDGE_DOCUMENT_MAX_FILE_BYTES:52428800}
      max-java-fast-file-bytes: ${REACHAI_KNOWLEDGE_JAVA_FAST_MAX_FILE_BYTES:52428800}
      format-probe-bytes: ${REACHAI_KNOWLEDGE_DOCUMENT_FORMAT_PROBE_BYTES:64}
    document-artifact-store:
      # local is for a single-node developer workstation only. Deployed instances
      # must use the shared S3-compatible backend so job retries work across pods.
      type: ${REACHAI_KNOWLEDGE_ARTIFACT_STORE_TYPE:local}
      local-root: ${REACHAI_KNOWLEDGE_ARTIFACT_LOCAL_ROOT:./data/reachai-knowledge-artifacts}
      endpoint: ${REACHAI_KNOWLEDGE_ARTIFACT_S3_ENDPOINT:}
      access-key: ${REACHAI_KNOWLEDGE_ARTIFACT_S3_ACCESS_KEY:}
      secret-key: ${REACHAI_KNOWLEDGE_ARTIFACT_S3_SECRET_KEY:}
      region: ${REACHAI_KNOWLEDGE_ARTIFACT_S3_REGION:us-east-1}
      bucket: ${REACHAI_KNOWLEDGE_ARTIFACT_S3_BUCKET:reachai-knowledge}
      auto-create-bucket: ${REACHAI_KNOWLEDGE_ARTIFACT_S3_AUTO_CREATE_BUCKET:true}
    docling:
      # Internal-only Docling Serve dependency. Browser traffic must never use this URL.
      enabled: ${REACHAI_DOCLING_ENABLED:true}
      base-url: ${REACHAI_DOCLING_BASE_URL:http://localhost:5001}
      # Matches the opt-in local Compose profile. Production deployments must
      # override this value from a Secret; the production configuration guard
      # rejects weak/default internal credentials.
      api-key: ${REACHAI_DOCLING_API_KEY:local-dev-change-me}
      expected-version: ${REACHAI_DOCLING_EXPECTED_VERSION:v1.30.0}
      connect-timeout-ms: ${REACHAI_DOCLING_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${REACHAI_DOCLING_REQUEST_TIMEOUT_MS:900000}
      document-timeout-seconds: ${REACHAI_DOCLING_DOCUMENT_TIMEOUT_SECONDS:900}
      # File/request and response bodies are streamed. Limit concurrent JSON
      # normalization so the Knowledge pod's heap remains bounded.
      max-concurrent-requests: ${REACHAI_DOCLING_MAX_CONCURRENT_REQUESTS:1}
      concurrency-wait-timeout-ms: ${REACHAI_DOCLING_CONCURRENCY_WAIT_TIMEOUT_MS:30000}
      max-response-bytes: ${REACHAI_DOCLING_MAX_RESPONSE_BYTES:67108864}
      # Verified against the pinned v1.30.0 OpenAPI contract.
      ocr-preset: ${REACHAI_DOCLING_OCR_PRESET:}
      ocr-languages: ${REACHAI_DOCLING_OCR_LANGUAGES:ch,en}
      table-mode: ${REACHAI_DOCLING_TABLE_MODE:accurate}
      image-export-mode: ${REACHAI_DOCLING_IMAGE_EXPORT_MODE:placeholder}
      do-ocr: ${REACHAI_DOCLING_DO_OCR:true}
      force-ocr: ${REACHAI_DOCLING_FORCE_OCR:false}
      do-table-structure: ${REACHAI_DOCLING_DO_TABLE_STRUCTURE:true}
      do-pdf-heading-hierarchy: ${REACHAI_DOCLING_DO_PDF_HEADING_HIERARCHY:true}
    document-import-worker:
      enabled: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_WORKER_ENABLED:true}
      poll-interval-ms: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_POLL_INTERVAL_MS:5000}
      dispatch-batch-size: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_DISPATCH_BATCH_SIZE:8}
      max-attempts: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_MAX_ATTEMPTS:3}
      lease-seconds: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_LEASE_SECONDS:1200}
      core-pool-size: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_CORE_POOL_SIZE:2}
      max-pool-size: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_MAX_POOL_SIZE:4}
      queue-capacity: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_QUEUE_CAPACITY:32}
      retry-initial-delay-seconds: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_RETRY_INITIAL_DELAY_SECONDS:10}
      retry-max-delay-seconds: ${REACHAI_KNOWLEDGE_DOCUMENT_IMPORT_RETRY_MAX_DELAY_SECONDS:300}
    console-ingress:
      # Must match Control. Large signed multipart bodies are spooled to a
      # temporary file and removed after Spring MVC finishes the request.
      max-body-bytes: ${REACHAI_KNOWLEDGE_CONSOLE_MAX_BODY_BYTES:104857600}
    project-ingress:
      max-body-bytes: ${REACHAI_KNOWLEDGE_PROJECT_MAX_BODY_BYTES:10485760}

# ---- RAG 閰嶇疆 ----
rag:
  default-top-k: 5
  score-threshold: 0.5

# ---- Pipeline 入库流水线配置 ----
pipeline:
  definitions:
    default:
      steps:
        - FILE_PARSE
        - TEXT_CLEAN
        - CHUNK
        - EMBEDDING
        - VECTOR_STORE
        - METADATA_PERSIST
    kb_contract:
      steps:
        - FILE_PARSE
        - TEXT_CLEAN
        - CHUNK
        - EMBEDDING
        - VECTOR_STORE
        - METADATA_PERSIST
    kb_scan:
      steps:
        - FILE_PARSE
        - TEXT_CLEAN
        - CHUNK
        - EMBEDDING
        - VECTOR_STORE
        - METADATA_PERSIST

spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 100MB

logging:
  level:
    com.enterprise.ai: DEBUG
    io.milvus: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
