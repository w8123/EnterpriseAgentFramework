# ReachAI 管理台 + 对外入口：静态页面由 nginx 提供，接口统一转给 Control（18603）。
map $http_accept $reachai_wants_html {
    default 0;
    "~text/html" 1;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    # 对话是 SSE 流，不能缓冲
    proxy_buffering off;
    proxy_cache off;

    location /api/ { proxy_pass http://reachai-control:18603; }
    location /ai/ { proxy_pass http://reachai-control:18603; }
    location /mcp { proxy_pass http://reachai-control:18603; }

    # /model/instances 既是管理台页面也是接口：浏览器打开页面时走前端路由
    location /model/ {
        if ($reachai_wants_html) { rewrite ^ /index.html last; }
        proxy_pass http://reachai-control:18603;
    }

    location /sdk/ {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
