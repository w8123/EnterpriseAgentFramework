apiVersion: apps/v1
kind: Deployment
metadata:
  name: reachai-knowledge-service
  labels:
    app: reachai-knowledge-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reachai-knowledge-service
  template:
    metadata:
      labels:
        app: reachai-knowledge-service
    spec:
      containers:
        - name: reachai-knowledge-service
          image: registry.enterprise.com/ai/reachai-knowledge-service:latest
          ports:
            - containerPort: 18602
          env:
            - name: AI_MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: mysql-url
            - name: AI_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: mysql-user
            - name: AI_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: mysql-password
            - name: REDIS_HOST
              value: redis
            - name: MILVUS_HOST
              value: milvus
            - name: MODEL_SERVICE_URL
              value: http://reachai-model-service:18601
            - name: REACHAI_DOCLING_BASE_URL
              value: http://reachai-docling:5001
            - name: REACHAI_DOCLING_MAX_CONCURRENT_REQUESTS
              value: "1"
            - name: REACHAI_DOCLING_MAX_RESPONSE_BYTES
              value: "67108864"
            - name: REACHAI_DOCLING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: docling-api-key
            - name: REACHAI_KNOWLEDGE_ARTIFACT_STORE_TYPE
              value: s3
            - name: REACHAI_KNOWLEDGE_ARTIFACT_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: knowledge-artifact-s3-endpoint
            - name: REACHAI_KNOWLEDGE_ARTIFACT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: knowledge-artifact-s3-access-key
            - name: REACHAI_KNOWLEDGE_ARTIFACT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: knowledge-artifact-s3-secret-key
            - name: REACHAI_KNOWLEDGE_ARTIFACT_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: knowledge-artifact-s3-bucket
            - name: REACHAI_KNOWLEDGE_ARTIFACT_S3_AUTO_CREATE_BUCKET
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /ai/actuator/health
              port: 18602
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reachai-knowledge-service
spec:
  selector:
    app: reachai-knowledge-service
  ports:
    - port: 18602
      targetPort: 18602
  type: ClusterIP
