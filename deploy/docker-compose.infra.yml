##
## 本地开发基础设施 — 一键拉起 MySQL / Redis / Milvus
## 使用方法: 先填写 deploy/.env，再执行
## docker compose --env-file deploy/.env -f deploy/docker-compose.infra.yml up -d
##
services:

  mysql:
    image: mysql:8.0
    container_name: eaf-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${REACHAI_MYSQL_ROOT_PASSWORD:?Set REACHAI_MYSQL_ROOT_PASSWORD in deploy/.env}"
      MYSQL_DATABASE: reach_ai
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: eaf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Milvus 单机模式（etcd + minio + milvus）
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: eaf-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: eaf-minio
    environment:
      MINIO_ACCESS_KEY: "${REACHAI_MINIO_ACCESS_KEY:?Set REACHAI_MINIO_ACCESS_KEY in deploy/.env}"
      MINIO_SECRET_KEY: "${REACHAI_MINIO_SECRET_KEY:?Set REACHAI_MINIO_SECRET_KEY in deploy/.env}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: eaf-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${REACHAI_MINIO_ACCESS_KEY:?Set REACHAI_MINIO_ACCESS_KEY in deploy/.env}"
      MINIO_SECRET_ACCESS_KEY: "${REACHAI_MINIO_SECRET_KEY:?Set REACHAI_MINIO_SECRET_KEY in deploy/.env}"
    volumes:
      - milvus-data:/var/lib/milvus

  # Opt-in because the image is large. Start with:
  # docker compose --env-file deploy/.env -f deploy/docker-compose.infra.yml --profile docling up -d
  docling:
    profiles: ["docling"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.docling
    image: reachai-docling:v1.30.0
    container_name: reachai-docling
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_API_KEY: "${REACHAI_DOCLING_API_KEY:?Set REACHAI_DOCLING_API_KEY in deploy/.env}"
      DOCLING_SERVE_MAX_FILE_SIZE: "52428800"
      DOCLING_SERVE_MAX_NUM_PAGES: "1000"
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "2"
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "8"

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
