##
## 本地开发基础设施。日常开发直接运行仓库根目录的 ./dev.sh，它会用这个文件启动 MySQL。
## 手动使用（配置都在根目录 reachai.env）：
##   docker compose --env-file reachai.env -f deploy/docker-compose.infra.yml up -d mysql
## 可选组件按需开启：
##   --profile milvus   知识库向量检索（Milvus + etcd + MinIO）
##   --profile redis    Runtime 会话状态改存 Redis 时才需要
##   --profile docling  知识库解析 PDF / Word 等文档（镜像较大）
## 表结构不用手动导入：服务首次连上空库时会自动建表。
##
services:

  mysql:
    image: mysql:8.0
    container_name: eaf-mysql
    ports:
      - "${AI_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${REACHAI_MYSQL_ROOT_PASSWORD:?请在 reachai.env 填写 REACHAI_MYSQL_ROOT_PASSWORD（./dev.sh 会自动生成）}"
      MYSQL_DATABASE: "${AI_MYSQL_DATABASE:-reach_ai}"
      MYSQL_USER: "${AI_MYSQL_USER:-reach_ai}"
      MYSQL_PASSWORD: "${AI_MYSQL_PASSWORD:?请在 reachai.env 填写 AI_MYSQL_PASSWORD（./dev.sh 会自动生成）}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: eaf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Milvus 单机模式（etcd + minio + milvus）
  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.16
    container_name: eaf-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: eaf-minio
    environment:
      MINIO_ACCESS_KEY: "${REACHAI_MINIO_ACCESS_KEY:-reachai-minio}"
      MINIO_SECRET_KEY: "${REACHAI_MINIO_SECRET_KEY:-reachai-minio-local-only}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.4.4
    container_name: eaf-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${REACHAI_MINIO_ACCESS_KEY:-reachai-minio}"
      MINIO_SECRET_ACCESS_KEY: "${REACHAI_MINIO_SECRET_KEY:-reachai-minio-local-only}"
    volumes:
      - milvus-data:/var/lib/milvus

  # 镜像较大，按需开启：docker compose --env-file reachai.env -f deploy/docker-compose.infra.yml --profile docling up -d
  docling:
    profiles: ["docling"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.docling
    image: reachai-docling:v1.30.0
    container_name: reachai-docling
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_API_KEY: "${REACHAI_DOCLING_API_KEY:-}"
      DOCLING_SERVE_MAX_FILE_SIZE: "52428800"
      DOCLING_SERVE_MAX_NUM_PAGES: "1000"
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "2"
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "8"

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
