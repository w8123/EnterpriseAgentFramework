openapi: 3.0.3
info: {title: Isolated order notes, version: '1'}
paths:
  /orders/{orderId}/notes:
    post:
      operationId: appendOrderNote
      security: [{ProjectApiKey: []}]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 40}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note, apiKey]
              properties:
                note: {type: string, minLength: 1, maxLength: 120}
                apiKey: {type: string, minLength: 1, maxLength: 80}
                priority: {type: integer, minimum: 1, maximum: 3, default: 2}
                notify: {type: boolean, default: true}
                kind: {type: string, enum: [COMMENT]}
      responses:
        '200':
          description: Appended in the isolated fixture
          content:
            application/json:
              schema: {type: object}
components:
  securitySchemes:
    ProjectApiKey: {type: apiKey, in: header, name: X-API-Key}
