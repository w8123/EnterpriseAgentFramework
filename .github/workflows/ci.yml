name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 中文测试数据和文件名需要 UTF-8 区域设置
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  go-sdk-compatibility:
    name: Go SDK · Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported only: every push runs this matrix and Actions minutes are limited.
        go: ['1.22.x', '1.25.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: reachai-go/go.mod
      - run: go test -race ./...
        working-directory: reachai-go
      - run: python ai-admin-front/scripts/check-go-sdk-snippet.py

  node-sdk-compatibility:
    name: Node SDK · Node ${{ matrix.node }} / Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest/newest pairs only (was 3x2 = 6 jobs per push) to save Actions minutes.
        include:
          - node: '20'
            express: '4'
          - node: '24'
            express: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix reachai-node --no-audit --no-fund
      - run: npm install --prefix reachai-node --no-save --package-lock=false --no-audit --no-fund express@${{ matrix.express }}
      - run: npm test --prefix reachai-node
      - run: node ai-admin-front/scripts/check-node-sdk-snippet.cjs
      - run: node scripts/check-node-sdk-consumer.mjs ${{ matrix.express }}

  backend:
    name: 后端测试（Maven）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 打包 Java SDK 下载产物
        # Control 对外提供 SDK/starter 下载，jar 不入库，测试前先构建并放进 classpath 资源目录
        run: |
          mvn -B -q install -Dmaven.test.skip=true -pl reachai-capability-sdk,reachai-spring-boot2-starter -am
          node scripts/pack-java-sdk-artifacts.mjs
      - name: 从源码打包 C# SDK 下载产物
        working-directory: reachai-dotnet
        run: |
          node ../scripts/pack-dotnet-sdk-artifacts.mjs --check
          dotnet run --project ProtocolTests/ProtocolTests.csproj -c Release
          dotnet build SampleOrders/SampleOrders.csproj -c Release
          python ProtocolTests/http_fixture_test.py
          node ../scripts/pack-dotnet-sdk-artifacts.mjs
      - name: 验证 Python SDK 和下载制品
        run: |
          python -m pip install 'setuptools==80.9.0' wheel
          python -m pip install -e 'reachai-python[test]'
          python -m pytest reachai-python/tests
          python ai-admin-front/scripts/check-python-sdk-snippet.py
          python scripts/pack-python-sdk-artifacts.py --check
          python scripts/pack-python-sdk-artifacts.py
      - name: 验证 Node SDK 和下载制品
        run: |
          npm ci --prefix reachai-node --no-audit --no-fund
          npm test --prefix reachai-node
          node ai-admin-front/scripts/check-node-sdk-snippet.cjs
          node scripts/pack-node-sdk-artifacts.mjs --check
          node scripts/pack-node-sdk-artifacts.mjs
          git diff --exit-code -- reachai-control-service/src/main/resources/ai-assist/artifacts/node-sdk
      - name: 验证 Go SDK 下载制品
        run: |
          python scripts/pack-go-sdk-artifacts.py --check
          python scripts/pack-go-sdk-artifacts.py
          git diff --exit-code -- reachai-control-service/src/main/resources/ai-assist/artifacts/go-sdk
      - name: 运行全部 Maven 模块测试
        run: mvn -B test -fae
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7

  frontend:
    name: 管理端检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 看板等按本地时间分桶的逻辑按北京时间断言
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: ai-admin-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-admin-front/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 契约检查
        run: |
          npm run check:glass-theme
          npm run check:dark-theme-compatibility
          npm run check:page-rhythm
          npm run check:page-header-family
          npm run check:overlay-migration
          npm run check:workflow-layout
          npm run check:studio-canvas
          npm run check:sdk-access-workbench
          npm run check:page-workbench
          npm run check:business-capability-workbench-ui
          npm run check:model-center-v2-ui
          node scripts/check-workflow-empty-state-ui.mjs
          node scripts/check-project-center-labels.mjs
          node scripts/check-vite-model-proxy.test.mjs
      - name: 单元测试
        run: |
          for suite in conversation sdk ai-coding workflow api-market skill model auth liquid-glass \
            knowledge dashboard runops mcp capability bmapi-retirement; do
            echo "::group::test:$suite"
            npm run -s "test:$suite"
            echo "::endgroup::"
          done
      - name: 构建（类型检查 + 打包 + 嵌入 SDK）
        run: npm run build

  repository:
    name: 仓库级检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 开源文件与提交历史检查
        if: github.repository == 'w8123/EnterpriseAgentFramework'
        run: node scripts/check-open-source.mjs
      - name: 安装 ripgrep
        # check-mojibake 用 rg 列出待扫描文件
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: 架构、接口、文档与 SQL 检查
        run: |
          node scripts/verify-architecture.mjs
          node scripts/check-consolidated-upgrade-sql.mjs
          node scripts/check-mcp-hub-sql.mjs
          node scripts/check-model-center-v2-sql.mjs
      - name: 安装管理端依赖
        # 部分盘点脚本用 ai-admin-front 里的 @vue/compiler-sfc 解析页面
        working-directory: ai-admin-front
        run: npm ci --no-audit --no-fund
      - name: 检查脚本自身的测试
        run: node --test scripts/*.test.mjs
      - name: Managed Executor Worker
        working-directory: managed-executor-worker
        run: |
          npm ci --no-audit --no-fund
          npm test
