# Replace upstream hosts with the real business BFF and ReachAI addresses.

location = /api/reachai/embed-token {
    proxy_pass http://business_bff;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep the business system's existing auth_request/auth_jwt policy here.
}

location /api/reachai/embed/ {
    proxy_pass https://reachai.example.com/api/embed/;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Do not apply the business JWT validator to this location.
}

location /reachai/registry/ {
    proxy_pass http://business_service/reachai/registry/;
    proxy_set_header X-ReachAI-App-Key $http_x_reachai_app_key;
    proxy_set_header X-ReachAI-Timestamp $http_x_reachai_timestamp;
    proxy_set_header X-ReachAI-Nonce $http_x_reachai_nonce;
    proxy_set_header X-ReachAI-Signature $http_x_reachai_signature;
    # Restrict source networks when possible; the Starter verifies signatures.
}

