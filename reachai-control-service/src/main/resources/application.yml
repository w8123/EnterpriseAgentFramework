server:
  port: ${SERVER_PORT:18603}

spring:
  application:
    name: reachai-control-service

  servlet:
    multipart:
      max-file-size: "20MB"
      max-request-size: "21MB"

  mvc:
    async:
      request-timeout: "10m"

  datasource:
    url: ${AI_MYSQL_URL:jdbc:mysql://${AI_MYSQL_HOST:localhost}:${AI_MYSQL_PORT:3306}/${AI_MYSQL_DATABASE:reach_ai}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${AI_MYSQL_USER:reach_ai}
    password: ${AI_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Internal nonce capacity reads require InnoDB shared next-key locks.
      transaction-isolation: TRANSACTION_REPEATABLE_READ

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 135000
          # Workflow authoring can require several constrained model/tool rounds.
          # Keep Control's runtime proxy lease longer than the browser's 5 minute authoring timeout.
          reachai-runtime-proxy:
            connectTimeout: 5000
            readTimeout: 270000
          reachai-page-workbench-runtime:
            connectTimeout: 5000
            readTimeout: 270000
          # Health probes use InternalHealthFeignConfig (1.5s connect / 2s read).
          # Named entries document intent; Feign configuration class is authoritative.
          reachai-runtime-health:
            connectTimeout: 1500
            readTimeout: 2000
          reachai-capability-health:
            connectTimeout: 1500
            readTimeout: 2000
          reachai-model-health:
            connectTimeout: 1500
            readTimeout: 2000
          reachai-knowledge-health:
            connectTimeout: 1500
            readTimeout: 2000

services:
  runtime-service:
    url: ${RUNTIME_SERVICE_URL:http://localhost:18604}
  capability-service:
    url: ${CAPABILITY_SERVICE_URL:http://localhost:18605}
  model-service:
    url: ${MODEL_SERVICE_URL:http://localhost:18601}
  knowledge-service:
    url: ${KNOWLEDGE_SERVICE_URL:http://localhost:18602}

reachai:
  control:
    managed-executor:
      projection-enabled: ${REACHAI_MANAGED_EXECUTION_PROJECTION_ENABLED:true}
      projection-delay-ms: 5000
  mcp-hub:
    # Public MCP transport starts with Control by default. Set the environment
    # variable to false when the target schema or internal HMAC is not ready.
    enabled: ${REACHAI_MCP_HUB_ENABLED:true}
    legacy-protocol-version: "2025-11-25"
    modern-protocol-version: ${REACHAI_MCP_HUB_MODERN_PROTOCOL_VERSION:2026-07-28}
    allowed-origins: ${REACHAI_MCP_HUB_ALLOWED_ORIGINS:}
    max-request-bytes: 524288
    max-execution-response-bytes: 8388608
    execution-timeout: "120s"
    connect-timeout: "15s"
    # Payload capture remains independently opt-in and is recursively redacted.
    capture-audit-payload: false
    max-audit-payload-chars: 32768
    audit-payload-retention-days: 7
  a2a-hub:
    # Public protocol routes remain fail-closed until the new schema, Trust
    # Profile, immutable Publication Revision, and protocol gate are ready.
    enabled: ${REACHAI_A2A_HUB_ENABLED:false}
    protocol-version: "1.0"
    agent-card-cache-max-age: "5m"
    # No source-controlled fallback is provided. Message/Artifact persistence
    # fails closed until a 32-byte Base64 AES key is injected at runtime.
    content-key-id: ${REACHAI_A2A_CONTENT_KEY_ID:}
    content-key-base64: ${REACHAI_A2A_CONTENT_KEY_BASE64:}
    # Outbound authentication material uses a separate runtime/KMS key domain.
    credential-key-id: ${REACHAI_A2A_CREDENTIAL_KEY_ID:}
    credential-key-base64: ${REACHAI_A2A_CREDENTIAL_KEY_BASE64:}
    audit-ip-hash-key: ${REACHAI_A2A_AUDIT_IP_HASH_KEY:}
    max-history-messages: 50
    max-page-size: 100
    outbox-delay: "1s"
    outbox-lease: "4m"
    outbox-heartbeat: "30s"
    outbox-batch-size: 10
    outbox-max-attempts: 5
    outbox-workers: 4
    deadline-scan-delay: "5s"
    outbound:
      connect-timeout: "5s"
      response-timeout: "10s"
      poll-scan-delay: "1s"
      initial-poll-delay: "2s"
      max-poll-delay: "15s"
      poll-lease: "30s"
      poll-batch-size: 20
      poll-workers: 4
      max-agent-card-bytes: 1048576
      # Public discovery uses 443 only by default. Additional HTTPS ports must
      # be explicitly reviewed and injected as a comma-separated runtime list.
      allowed-ports: ${REACHAI_A2A_OUTBOUND_ALLOWED_PORTS:443}
      # Enabling private networks materially changes the SSRF boundary and is
      # intentionally runtime-only. Production defaults to public HTTPS only.
      private-network-allowed: false
  skill:
    artifact-root: ${REACHAI_SKILL_ARTIFACT_ROOT:${java.io.tmpdir}/reachai-control/skill-artifacts}
    max-package-bytes: ${REACHAI_SKILL_MAX_PACKAGE_BYTES:20971520}
    max-expanded-bytes: 104857600
    max-single-file-bytes: 20971520
    max-files: 1024
    # Repository/plugin bundles are discovery inputs only. The selected Skill
    # is deterministically rewritten and must still satisfy the stricter limits above.
    max-bundle-bytes: 67108864
    max-bundle-expanded-bytes: 268435456
    max-bundle-single-file-bytes: 67108864
    max-bundle-files: 8192
    builtin-bootstrap-enabled: ${REACHAI_SKILL_BUILTIN_BOOTSTRAP_ENABLED:true}
  skill-market:
    enabled: ${REACHAI_SKILL_MARKET_ENABLED:true}
    connect-timeout: "5s"
    read-timeout: "30s"
    max-json-bytes: 2097152
    # Keep false unless a trusted transparent proxy maps allowlisted public hosts into
    # the RFC 2544 198.18.0.0/15 fake-IP pool. This never permits other private ranges.
    allow-synthetic-proxy-dns: ${REACHAI_SKILL_MARKET_ALLOW_SYNTHETIC_PROXY_DNS:false}
    skills-sh:
      base-url: ${REACHAI_SKILLS_SH_BASE_URL:https://skills.sh}
      oidc-token: ${REACHAI_SKILLS_SH_OIDC_TOKEN:}
      legacy-search-enabled: ${REACHAI_SKILLS_SH_LEGACY_SEARCH_ENABLED:true}
    github:
      api-base-url: ${REACHAI_SKILL_MARKET_GITHUB_API_BASE_URL:https://api.github.com}
      token: ${REACHAI_SKILL_MARKET_GITHUB_TOKEN:}
  auth:
    # LOCAL quick start uses the well-known development administrator below.
    # Production deployments must disable LOCAL/bootstrap or replace it.
    provider: "LOCAL"
    session-ttl: "24h"
    session-cookie:
      # AUTO is convenient for localhost; production deployments must use ALWAYS.
      secure: ${REACHAI_PLATFORM_SESSION_COOKIE_SECURE:AUTO}
    local:
      enabled: ${REACHAI_LOCAL_AUTH_ENABLED:true}
      bootstrap-admin:
        enabled: ${REACHAI_BOOTSTRAP_ADMIN_ENABLED:true}
        username: ${REACHAI_BOOTSTRAP_ADMIN_USERNAME:admin}
        password: ${REACHAI_BOOTSTRAP_ADMIN_PASSWORD:admin123}
  internal:
    # Shared with Runtime. Required for trusted Agent/Embed execute (sync + SSE). Fail-closed when blank.
    service-secret: ${REACHAI_INTERNAL_SERVICE_SECRET:}
    # Verification-only overlap keys used during rolling rotation.
    accepted-service-secrets: ${REACHAI_INTERNAL_SERVICE_ACCEPTED_SECRETS:}
    # Production: DIRECT_TLS requires https URLs; MTLS_MESH explicitly attests sidecar/mesh protection.
    transport-mode: ${REACHAI_INTERNAL_TRANSPORT_MODE:DEVELOPMENT_PLAINTEXT}
    auth:
      skew-seconds: 300
      nonce-ttl-seconds: 600
      nonce-max-entries: 100000
      max-body-bytes: 1048576
  knowledge:
    console-ingress:
      # Browser traffic terminates at Control. Control signs the exact body sent
      # to Knowledge; direct anonymous /ai/biz-index access is not supported.
      tenant-id: "default"
      max-body-bytes: 104857600
      max-response-bytes: 16777216
    project-ingress:
      # Structured JSON only. Attachments remain a console operation until a
      # streaming detached-signature contract is introduced.
      max-body-bytes: 10485760
  context:
    personal-memory:
      outbox-enabled: ${REACHAI_PERSONAL_MEMORY_OUTBOX_ENABLED:true}
      # Shared only with Knowledge for deterministic owner pseudonyms. It must differ
      # from REACHAI_INTERNAL_SERVICE_SECRET and be rotated with projection rebuild evidence.
      index-identity-secret: ${REACHAI_PERSONAL_MEMORY_INDEX_IDENTITY_SECRET:}
      default-tenant: "default"
      recall-top-k: 8
      recall-max-chars: 6000
      max-active-items-per-owner: 1000
      # OFF -> no projection query; SHADOW -> compare without affecting answers;
      # ACTIVE -> projection ids may influence canonical ranking. The legacy boolean
      # remains a compatibility fallback: true=ACTIVE, false=OFF.
      knowledge-query-mode: ${REACHAI_PERSONAL_MEMORY_KNOWLEDGE_QUERY_MODE:${REACHAI_PERSONAL_MEMORY_KNOWLEDGE_QUERY_ENABLED:false}}
      outbox-delay-ms: 2000
      outbox-observability-delay-ms: 30000
      outbox-observability-initial-delay-ms: 10000
      lifecycle-enabled: ${REACHAI_PERSONAL_MEMORY_LIFECYCLE_ENABLED:true}
      lifecycle-batch-size: 100
      lifecycle-delay-ms: 60000
      lifecycle-initial-delay-ms: 60000
      # Fail closed until the current initV2 baseline (or its historical migration chain) is installed.
      erasure-worker-enabled: ${REACHAI_MEMORY_ERASURE_WORKER_ENABLED:false}
      erasure-worker-batch-size: 10
      erasure-worker-delay-ms: 5000
      erasure-worker-initial-delay-ms: 15000
  embed:
    cors:
      enabled: ${REACHAI_EMBED_CORS_ENABLED:false}

management:
  health:
    # Control 不使用 Redis，不让 Redis 是否在线影响健康检查。
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
